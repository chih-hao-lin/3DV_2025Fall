dataloader_cfg: &dataloader_cfg
    dataset_cfg: &dataset_cfg
        force_sparse_view: True # ignore assertion
        # prettier-ignore
        view_sample: [0, 1, 2, 3] # select all views for sampling, all 60 views
        # prettier-ignore
        ratio: [0.5, 0.5, 0.5, 0.5]

val_dataloader_cfg:
    <<: *dataloader_cfg
    dataset_cfg:
        <<: *dataset_cfg
        frame_sample: [0, 150, 20] # eval on every 20 frames
