seed: 3
experiment_name: 'sam'
resume: True
stats_print_interval: 10
validation_epoch_interval: 5
checkpoint_epoch_interval: 5
checkpoint_path: ''
output_dir: ''
data:
  train_dataset_names: ['3doi_v1']
  val_dataset_names: ['3doi_v1']
  test_dataset_names: ['3doi_v1']
  image_size: [768, 1024]
  output_size: [768, 1024]
  num_workers: 2
  affordance_radius: 5 # gaussian bump of affordance
  num_queries: 15 # maximal number of object queries
  bbox_to_mask: False  # converting bbox to binary mask when preparing data
train:
  batch_size: 1
  num_views: 1
  eval_only: False
  depth_on: True
test:
  epoch: None
  mode: 'export_imgs'
  split: 'test'
  num_samples: 100
  use_depth: False
  shortlist: None
optimizer:
  name: 'AdamW'
  max_epochs: 200
  mixed_precision: 'fp16'
  lr: 1e-4
  lr_backbone: 1e-5
  lr_scheduler_name: 'StepLR'
  lr_scheduler_step_size: 500 # epoch
  lr_scheduler_gamma: 0.1
  clip_max_norm: 0.1
  lbd_movable: 0.5
  lbd_rigid: 0.5
  lbd_kinematic: 0.5
  lbd_action: 0.5
  lbd_mask: 2.0
  lbd_dice: 1.0
  lbd_affordance: 400.0
  lbd_bbox: 5.0
  lbd_giou: 2.0
  lbd_axis: 2.0
  lbd_axis_offset: 10.0
  lbd_eascore: 0.0
  lbd_depth: 1.0
  lbd_vnl: 0.0
  affordance_focal_alpha: 0.95 # focal loss 
  freeze_backbone: False
  ignore_index: -100  # pytorch F.cross_entropy default value
  loss_mask_type: 'focal'
visualization:
  history_size: 10
  visdom: True
  visdom_server: 'http://nordrassil.eecs.umich.edu'
  visdom_port: 8097
unet:
  n_embedding: 64
model:
  name: "sam"
  freeze_layers: []
  fusion: 'concat'
  backbone_name: "vit_b"
  sam_pretrained: False # do not load from SAM initial checkpoint
  transformer_hidden_dim: 256
  transformer_dropout: 0.1
  transformer_nhead: 8
  transformer_dim_feedforward: 2048
  transformer_num_encoder_layers: 6
  transformer_num_decoder_layers: 6
  transformer_normalize_before: False
  transformer_return_intermediate_dec: True
  layers_movable: 3
  layers_rigid: 3
  layers_kinematic: 3
  layers_action: 3
  layers_axis: 2
  layers_affordance: 3
  axis_bins: 30
hydra:
  sweep:
    dir: "multirun/${experiment_name}/${now:%Y-%m-%d-%H-%M-%S}"
  run:
    dir: "outputs/${experiment_name}/${now:%Y-%m-%d-%H-%M-%S}"
  job:
    chdir: True
  launcher:
    name: 'SAM'
    timeout_min: 8640
    cpus_per_task: 4
    gpus_per_node: 4
    tasks_per_node: 4
    mem_per_cpu: 12000
    account: 'fouhey2'
    nodes: 1
    partition: 'spgpu'
    exclude: 'gl1522'
